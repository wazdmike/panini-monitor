name: Monitor Bleach Remix - Panini
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Enviar mensagem de teste (sem consultar preços)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: panini-price-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Executar monitor ou teste do Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          if [ "$TEST_TELEGRAM" = "true" ]; then
            python monitor.py --test-telegram
          else
            python monitor.py
          fi
      - name: Salvar histórico de disponibilidade
        if: ${{ inputs.test_telegram != true }}
        run: |
          git add prices.json pending_alerts.json availability.json volume_status.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: atualiza disponibilidade dos volumes da Panini'
            git push
          else
            echo 'Nenhuma alteração no histórico.'
          fi
